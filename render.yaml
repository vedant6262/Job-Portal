databases:
  - name: job-portal-db
    databaseName: jobportal
    user: jobportal
    plan: free
    region: oregon

services:
  - type: web
    name: job-portal-cv
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./Dockerfile.cv
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CV_SERVICE_HOST
        value: 0.0.0.0
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"

  - type: web
    name: job-portal-backend
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEV_AUTH
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: job-portal-db
          property: connectionString
      - key: CV_SERVICE_URL
        fromService:
          name: job-portal-cv
          type: web
          property: host
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ARBEITNOW_API_URL
        value: https://arbeitnow.com/api/job-board-api
      - key: ARBEITNOW_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
